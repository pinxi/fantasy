# One always-on machine runs worker + web against the SQLite volume.
# auto_stop stays off: the worker's cron schedule IS the product — a stopped
# machine means missed daily snapshots, which can never be backfilled.
app = "pinxi-fantasy"
primary_region = "ewr"

[build]

[env]
  DATA_DIR = "/data"
  TZ = "America/New_York"

[mounts]
  source = "fantasy_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
